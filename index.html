<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>경희중 ↔ 同志社中 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  /* Airbnb tokens */
  --rausch:#ff385c; --rausch-a:#e00b41; --rausch-d:#ffd1da; --rausch-t:#fff0f3;
  --ink:#222222; --body:#3f3f3f; --muted:#6a6a6a; --muted-s:#929292;
  --hair:#dddddd; --hair-s:#ebebeb; --strong:#c1c1c1;
  --canvas:#ffffff; --soft:#f7f7f7; --surf-strong:#f2f2f2;
  --shadow: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;

  font-family:'Inter','Noto Sans KR','Noto Sans JP',-apple-system,system-ui,sans-serif;
  background:var(--canvas); color:var(--ink);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
body[data-lang="ja"]{font-family:'Inter','Noto Sans JP','Noto Sans KR',-apple-system,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:88px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit}

/* ─── top nav ─── */
.nav{height:72px;padding:0 16px;border-bottom:1px solid var(--hair-s);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;background:var(--canvas);z-index:15}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9999px;background:var(--rausch);
  color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.brand-txt{min-width:0}
.brand-t{font-size:16px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:12px;font-weight:400;line-height:1.33;color:var(--muted);white-space:nowrap}
.lang{display:flex;border:1px solid var(--hair);border-radius:9999px;overflow:hidden;flex-shrink:0}
.lang button{padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);line-height:1.23}
.lang button[data-on="1"]{background:var(--ink);color:#fff;font-weight:600}

/* ─── shared ─── */
.wrap{padding:24px 16px 8px}
.sec{padding:0 16px}
.h-lg{font-size:22px;font-weight:600;line-height:1.18;letter-spacing:-.44px}
.h-md{font-size:16px;font-weight:600;line-height:1.25}
.tag-up{font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;color:var(--muted)}
.micro{font-size:12px;font-weight:700;line-height:1.33}
.b-sm{font-size:14px;font-weight:400;line-height:1.43;color:var(--body)}
.cap-sm{font-size:13px;font-weight:400;line-height:1.4;color:var(--muted)}
.note{padding:16px;margin:0 16px 24px;font-size:13px;line-height:1.6;color:var(--muted);
  background:var(--soft);border-radius:14px}

.card{background:var(--canvas);border:1px solid var(--hair-s);border-radius:14px;
  margin:0 16px 16px;overflow:hidden}
.btn{display:block;width:100%;height:48px;border-radius:8px;background:var(--rausch);
  color:#fff;font-size:16px;font-weight:500;line-height:1.25;transition:background .15s}
.btn:active:not(:disabled){background:var(--rausch-a)}
.btn:disabled{background:var(--rausch-d);cursor:not-allowed}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 16px 16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex-shrink:0;padding:9px 16px;border-radius:9999px;border:1px solid var(--hair);
  font-size:14px;font-weight:500;line-height:1.29;color:var(--body);background:var(--canvas)}
.strip button[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.dot{width:5px;height:5px;border-radius:9999px;background:var(--rausch);display:inline-block;margin-left:5px;vertical-align:2px}

/* ─── translate ─── */
.dirbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--hair-s)}
.dirbar span{flex:1;text-align:center;font-size:16px;font-weight:600;line-height:1.25}
.swap{width:40px;height:40px;border-radius:9999px;background:var(--surf-strong);
  display:grid;place-items:center;font-size:15px;color:var(--ink);flex-shrink:0;
  transition:transform .35s cubic-bezier(.4,0,.2,1)}
.swap:active{transform:rotate(180deg)}
#src{display:block;width:100%;min-height:110px;resize:none;border:none;background:transparent;
  padding:20px 16px 12px;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  -webkit-appearance:none;appearance:none;border-radius:0;
  -webkit-user-select:text;user-select:text;touch-action:manipulation;
  pointer-events:auto;opacity:1;z-index:1;position:relative}
#src:focus{outline:none}
#src::placeholder{color:var(--muted-s)}
.microw{display:flex;gap:8px;padding:0 16px 14px}
.mic{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  height:46px;border-radius:9999px;border:1px solid var(--hair);background:var(--canvas);
  font-size:14px;font-weight:600;color:var(--ink);transition:background .15s,border-color .15s}
.mic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mic:active{background:var(--soft)}
.mic[data-on="1"]{background:var(--rausch);border-color:var(--rausch);color:#fff}
.mic[data-on="1"] .mdot{animation:mdot 1s ease-in-out infinite}
@keyframes mdot{0%,100%{opacity:1}50%{opacity:.2}}
.micmsg{padding:0 16px 14px;font-size:13px;line-height:1.5;color:var(--muted)}
.micmsg[data-err="1"]{color:var(--rausch-a)}
.gowrap{padding:0 16px 16px}
.out{border-top:1px solid var(--hair-s);padding:24px 16px;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.out-main{font-size:22px;font-weight:600;line-height:1.35;letter-spacing:-.44px;word-break:break-word}
.out-read{margin-top:12px;font-size:16px;font-weight:500;line-height:1.4;color:var(--rausch)}
.out-lbl{font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.out-note{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair-s);
  font-size:13px;line-height:1.5;color:var(--muted)}
.copy{margin-top:20px;font-size:14px;font-weight:500;color:var(--ink);
  text-decoration:underline;text-underline-offset:3px}
.err{padding:20px 16px;border-top:1px solid var(--hair-s);font-size:14px;line-height:1.5;color:#c13515}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:9999px;animation:sp .7s linear infinite;
  vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ─── phrases ─── */
.ph{padding:16px;border-bottom:1px solid var(--hair-s);display:flex;gap:12px;align-items:flex-start}
.ph-tx{flex:1;min-width:0}
.say{width:42px;height:42px;border-radius:9999px;border:1px solid var(--hair);
  background:var(--canvas);display:grid;place-items:center;flex-shrink:0;margin-top:2px;
  transition:background .15s,border-color .15s}
.say svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.say:active{background:var(--soft)}
.say[data-on="1"]{background:var(--rausch);border-color:var(--rausch)}
.say[data-on="1"] svg{stroke:#fff}
.say[data-on="1"] .wv{animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{opacity:1}50%{opacity:.25}}
.say-out{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:9999px;
  border:1px solid var(--hair);background:var(--canvas);vertical-align:middle;margin-left:10px}
.say-out svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.say-out[data-on="1"]{background:var(--rausch);border-color:var(--rausch)}
.say-out[data-on="1"] svg{stroke:#fff}
.ph:last-child{border-bottom:none}
.ph-main{font-size:16px;font-weight:600;line-height:1.35}
.ph-read{font-size:14px;font-weight:500;line-height:1.43;color:var(--rausch);margin-top:5px}
.ph-sub{font-size:13px;font-weight:400;line-height:1.4;color:var(--muted);margin-top:6px}

/* ─── missions ─── */
.blk{margin:0 16px 32px}
.blk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.blk-time{font-size:14px;font-weight:700;line-height:1.29;color:var(--rausch)}
.blk-title{font-size:22px;font-weight:600;line-height:1.18;letter-spacing:-.44px}
.teams{border:1px solid var(--hair-s);border-radius:14px;overflow:hidden;margin-bottom:12px}
.team{padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;
  border-bottom:1px solid var(--hair-s)}
.team:last-child{border-bottom:none}
.tn{min-width:0}
.tn.kr{text-align:right}
.nm{display:block;margin:3px 0}
.nm b{display:block;font-size:14px;font-weight:600;line-height:1.29}
.nm i{display:block;font-style:normal;font-size:11px;font-weight:400;line-height:1.3;
  color:var(--muted-s);letter-spacing:.02em;margin-top:1px}
.badge{padding:4px 10px;border-radius:9999px;background:var(--surf-strong);
  font-size:11px;font-weight:600;line-height:1.18;flex-shrink:0;margin-top:4px}

.mlist{border:1px solid var(--hair-s);border-radius:14px;overflow:hidden}
.ms{display:flex;gap:14px;padding:16px;width:100%;text-align:left;
  border-bottom:1px solid var(--hair-s);background:var(--canvas)}
.ms:last-child{border-bottom:none}
.chk{width:24px;height:24px;border-radius:9999px;border:1.5px solid var(--strong);
  flex-shrink:0;margin-top:1px;display:grid;place-items:center;font-size:12px;
  color:transparent;transition:all .18s}
.ms[data-done="1"] .chk{background:var(--rausch);border-color:var(--rausch);color:#fff}
.ms[data-done="1"] .ms-t{color:var(--muted-s);text-decoration:line-through}
.ms-k{display:block;font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.ms-t{display:block;font-size:16px;font-weight:500;line-height:1.4}
.ms-s{display:block;font-size:13px;line-height:1.5;color:var(--muted);margin-top:6px}

.move{border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--soft)}
.move-l{font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.move-p{font-size:16px;font-weight:600;line-height:1.35}
.bus{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:9999px;
  background:var(--canvas);border:1px solid var(--hair);
  font-size:13px;font-weight:500;line-height:1.3;color:var(--body)}
.move-n{font-size:13px;line-height:1.5;color:var(--muted);margin-top:10px}
.mlink{display:inline-block;margin-top:12px;font-size:14px;font-weight:500;
  text-decoration:underline;text-underline-offset:3px}

.meet{border:1px solid var(--rausch);border-radius:14px;padding:20px 16px;margin-top:12px;background:var(--rausch-t)}
.meet-t{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:var(--rausch)}
.meet-l{font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;
  color:var(--rausch);margin-bottom:8px}
.meet-p{font-size:16px;font-weight:600;line-height:1.35;margin-top:8px}
.meet-n{font-size:13px;line-height:1.5;color:var(--body);margin-top:8px}

.prog{margin:0 16px 24px;padding:20px;border:1px solid var(--hair-s);border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.prog-n{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-1px}
.prog-n span{font-size:16px;font-weight:400;color:var(--muted-s);letter-spacing:0}
.bar{height:4px;background:var(--surf-strong);border-radius:9999px;margin-top:10px;overflow:hidden;width:104px}
.bar i{display:block;height:100%;background:var(--rausch);border-radius:9999px;transition:width .4s}

/* ─── schedule ─── */
.clock{padding:32px 16px 24px;text-align:center;border-bottom:1px solid var(--hair-s);margin-bottom:24px}
.clock-t{font-size:64px;font-weight:700;line-height:1.1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.clock-d{font-size:13px;font-weight:400;line-height:1.23;color:var(--muted);margin-top:4px}
.clock-a{margin-top:20px;padding:16px;border-radius:14px;background:var(--soft);text-align:left}
.clock-l{font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.clock-c{font-size:16px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:8px}
.clock-x{font-size:13px;line-height:1.4;color:var(--muted);margin-top:8px}
.pulse{width:8px;height:8px;border-radius:9999px;background:var(--rausch);flex-shrink:0;
  animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.2}}

.tl{margin:0 16px}
.row{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:14px 0;
  border-bottom:1px solid var(--hair-s);transition:opacity .25s}
.row:last-child{border-bottom:none}
.row[data-st="past"]{opacity:.38}
.row[data-st="now"]{background:var(--rausch-t);margin:0 -12px;padding:14px 12px;
  border-radius:14px;border-bottom-color:transparent}
.row-t{font-size:14px;font-weight:700;line-height:1.43;color:var(--muted);font-variant-numeric:tabular-nums}
.row[data-st="now"] .row-t{color:var(--rausch)}
.row-c{font-size:16px;font-weight:500;line-height:1.4}
.row[data-st="now"] .row-c{font-weight:600}
.row-s{display:block;font-size:13px;line-height:1.45;color:var(--muted);margin-top:5px}

.mblk{margin:0 0 6px 68px}
.mblk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:13px 15px;border:1px solid var(--hair);border-radius:12px;background:var(--canvas);
  text-align:left;transition:background .15s}
.mblk-h:active{background:var(--soft)}
.mblk-h b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.mblk-h i{display:block;font-style:normal;font-size:12px;font-weight:500;
  line-height:1.3;color:var(--muted);margin-top:3px}
.chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .22s}
.mblk[data-open="1"] .mblk-h{border-color:var(--strong)}
.mblk[data-open="1"] .chev{transform:rotate(180deg)}
.mblk-b{margin-top:10px;animation:rise .2s ease-out}
.mblk-b .teams{margin-bottom:10px}
.row-m{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:6px 11px;
  border-radius:9999px;border:1px solid var(--hair);background:var(--canvas);
  font-size:12px;font-weight:600;line-height:1.2;color:var(--ink);text-decoration:none}
.row-m svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.row-m:active{background:var(--soft)}
.row-p+.row-m,.row-m+.row-p{margin-left:6px}
.row-p{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;
  border-radius:9999px;background:var(--rausch-t);border:1px solid var(--rausch-d);
  font-size:13px;font-weight:600;line-height:1.3;color:var(--rausch)}
.row-p svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.row[data-st="now"] .row-p{background:var(--canvas)}
.prep{margin:24px 16px;padding:20px;border:1px solid var(--hair-s);border-radius:14px}
.prep p{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--body)}
.sos{margin:0 16px 24px;padding:20px;border-radius:14px;background:var(--ink);color:#fff}
.sos p{margin:0 0 10px;font-size:14px;line-height:1.5;opacity:.82}
.sos p:last-child{margin:0}
.sos-l{font-size:8px;font-weight:700;letter-spacing:.32px;text-transform:uppercase;
  opacity:.5;margin-bottom:10px}
.call{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;
  margin-top:16px;border-radius:8px;background:var(--rausch);color:#fff;
  font-size:16px;font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}

/* ─── bottom tabs ─── */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:grid;grid-template-columns:repeat(3,1fr);background:var(--canvas);
  border-top:1px solid var(--hair-s);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{padding:10px 0 12px;display:grid;gap:4px;justify-items:center;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:11px;font-weight:500;line-height:1.2}
.tab[data-on="1"]{color:var(--rausch)}
.tab[data-on="1"] span{font-weight:600}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-lang="ko">
<div id="app">
  <header class="nav">
    <div class="brand">
      <div class="brand-mark">交</div>
      <div class="brand-txt">

        <div class="brand-s">2026. 8. 20 — 8. 23</div>
      </div>

      <button data-lang="ko">한국어</button><button data-lang="ja">日本語</button>

  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<script>
/* ═══════════ 설정 ═══════════ */
var CONFIG = {

  teacherTel:{ko:"010-2006-4862",ja:"+82-10-2006-4862"},
  apiKey:""     // ← 비워두면 무료 번역 엔진 사용
};

/* ═══════════ UI 문자열 ═══════════ */
var T={
  brand:{ko:"경희중 × 同志社中",ja:"慶熙中 × 同志社中"},
  tabs:{ko:["번역","회화","일정"],ja:["翻訳","会話","日程"]},
  mapLbl:{ko:"지도",ja:"地図"},
  missionLbl:{ko:"미션",ja:"ミッション"},
  sayLbl:{ko:"소리로 듣기",ja:"音声で聞く"},
  micKo:{ko:"한국어로 말하기",ja:"韓国語で話す"},
  micJa:{ko:"일본어로 말하기",ja:"日本語で話す"},
  micOn:{ko:"듣고 있어요. 또박또박 말해보세요.",ja:"聞いています。はっきり話してみてください。"},
  micDone:{ko:"입력됐어요. 틀린 곳은 직접 고쳐도 됩니다.",ja:"入力されました。間違いは直接直せます。"},

};
function addFinal(str,fin){
  if(!str)return str;
  var last=str.charCodeAt(str.length-1);
  if(last<0xAC00||last>0xD7A3)return str;
  if((last-0xAC00)%28!==0)return str;
  return str.slice(0,-1)+String.fromCharCode(last+fin);
}
function longVowel(out,ch){
  if(!out)return ch;
  var p=out.charCodeAt(out.length-1);
  if(p<0xAC00||p>0xD7A3)return ch;
  var med=Math.floor(((p-0xAC00)%588)/28);
  if(ch==="우"&&(med===8||med===13||med===12||med===17))return "-";
  if(ch==="이"&&(med===5||med===1||med===20))return "-";
  return ch;
}
function kanaToHangul(text){
  var s="";
  for(var i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    s+=(c>=0x30A1&&c<=0x30F6)?String.fromCharCode(c-0x60):text[i];
  }
  var out="",j=0;
  while(j<s.length){
    var two=s.substr(j,2);
    if(two.length===2&&KANA[two]){out+=longVowel(out,KANA[two]);j+=2;continue;}
    var one=s[j];
    if(one==="っ"){out=addFinal(out,19);j++;continue;}
    if(one==="ん"){out=addFinal(out,4)||(out+"ㄴ");j++;continue;}
    if(one==="ー"||one==="－"){out+="-";j++;continue;}
    if(KANA[one]){out+=longVowel(out,KANA[one]);j++;continue;}
    out+=one;j++;
  }
  return out;
}
function hasKana(s){return /[\u3040-\u30FF]/.test(s);}
function hasHangul(s){return /[\uAC00-\uD7AF]/.test(s);}

  mem[k]=v;
}

  try{ if(window.storage&&window.storage.get){var r=await window.storage.get(k);if(r&&r.value)return r.value;} }catch(e){}

}

async function translateClaude(text,toJa){
  var target=toJa?"일본어":"한국어";
  var readLabel=toJa
    ?"일본어 번역문을 한국 학생이 소리 내어 읽도록 한글로 적습니다. 장음은 '-'로 표기합니다."
    :"한국어 번역문을 일본 학생이 소리 내어 읽도록 가타카나로 적습니다.";
  var prompt="한국 중학생과 일본 중학생이 홈스테이 교류 중에 서로 대화하려고 쓰는 번역기입니다.\n\n다음 문장을 "+target+"로 번역하세요.\n\n문장: "+text+
  "\n\n규칙:\n- 중학생끼리 쓰는 자연스럽고 친근한 말투로 번역합니다.\n- 어른(선생님·부모님)에게 하는 말로 보이면 정중한 말투로 번역합니다.\n- reading에는 "+readLabel+
  "\n- note는 문화·표현상 알아두면 좋은 점이 있을 때만 한 문장, 없으면 빈 문자열.\n\nJSON만 출력하세요.\n{\"target\":\"번역문\",\"reading\":\"발음\",\"note\":\"\"}";
  var headers={"Content-Type":"application/json"};
  if(CONFIG.apiKey){
    headers["x-api-key"]=CONFIG.apiKey;
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
  }
  var res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:headers,
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
  });
  if(!res.ok)throw new Error("api");
  var data=await res.json();
  var raw=data.content.filter(function(b){return b.type==="text";})
    .map(function(b){return b.text;}).join("").replace(/```json|```/g,"").trim();
  return JSON.parse(raw);
}
async function translateFree(text,toJa){
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+(toJa?"ko|ja":"ja|ko");
  var res=await fetch(url);
  if(!res.ok)throw new Error("free");
  var d=await res.json();
  var tx=d&&d.responseData&&d.responseData.translatedText;
  if(!tx)throw new Error("free");
  return {target:tx, reading:toJa?kanaToHangul(tx):"", note:""};
}
async function doTranslate(text,toJa){
  try{ return await translateClaude(text,toJa); }
  catch(e){ return await translateFree(text,toJa); }
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var STT = !!SR;

function micIcon(){
  return '<svg viewBox="0 0 24 24"><rect class="mdot" x="9" y="2.5" width="6" height="11" rx="3"/>'+
    '<path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M9 21h6"/></svg>';
}
function micMsg(txt,isErr){
  var el=document.getElementById("micmsg");
  if(!el)return;
  el.textContent=txt||"";
  el.dataset.err=isErr?"1":"0";
}
function micOff(){
  document.querySelectorAll(".mic").forEach(function(b){b.dataset.on="0";});
}
function stopRec(){
  if(recObj){ try{ recObj.stop(); }catch(e){} }
  recObj=null; recLang=null; micOff();
}
function startRec(lang,btn){
  if(!STT){ micMsg(t("micNo"),true); return; }
  if(recObj){ var same=(recLang===lang); stopRec(); if(same)return; }
  if(TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} clearSay(); }
  var ta=document.getElementById("src");
  if(!ta)return;
  var r;
  try{ r=new SR(); }catch(e){ micMsg(t("micNo"),true); return; }
  r.lang=lang; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  recObj=r; recLang=lang; recBase=ta.value.trim(); recFinal="";
  micOff(); if(btn)btn.dataset.on="1";
  micMsg(t("micOn"),false);

  r.onresult=function(e){
    var itm="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res=e.results[i];
      if(res.isFinal) recFinal+=res[0].transcript;
      else itm+=res[0].transcript;
    }
    var el=document.getElementById("src"); if(!el)return;
    el.value=(recBase?recBase+" ":"")+recFinal+itm;
    onSrcInput(el);
  };
  r.onerror=function(e){
    var c=e&&e.error;
    micMsg(c==="not-allowed"||c==="service-not-allowed" ? t("micDeny")
         : c==="no-speech" ? t("micNone")
         : c==="network" ? t("micNet") : t("micFail"), true);
    recObj=null; recLang=null; micOff();
  };
  r.onend=function(){
    recObj=null; recLang=null; micOff();
    var el=document.getElementById("src");
    if(el&&el.value.trim()) micMsg(t("micDone"),false);
  };
  try{ r.start(); }
  catch(e){ recObj=null;recLang=null;micOff();micMsg(t("micFail"),true); }
}

var TTS = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
var VOICES=[];
function loadVoices(){ try{ VOICES=window.speechSynthesis.getVoices()||[]; }catch(e){ VOICES=[]; } }
if(TTS){
  loadVoices();
  try{ window.speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
}
function pickVoice(lang){
  if(!VOICES.length) loadVoices();
  var pre=lang.slice(0,2);
  var exact=VOICES.filter(function(v){return v.lang&&v.lang.replace("_","-")===lang;});
  if(exact.length){
    var local=exact.filter(function(v){return v.localService;});
    return (local[0]||exact[0]);
  }
  var loose=VOICES.filter(function(v){return v.lang&&v.lang.slice(0,2)===pre;});
  return loose[0]||null;
}
function sayIcon(){
  return '<svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/>'+
    '<path class="wv" d="M16 9.4a3.6 3.6 0 010 5.2M18.6 7a7 7 0 010 10"/></svg>';
}
function clearSay(){
  document.querySelectorAll('[data-on="1"].say,[data-on="1"].say-out').forEach(function(b){b.dataset.on="0";});
}
function speak(txt,lang,btn){
  if(!TTS) return;
  var sy=window.speechSynthesis, wasOn=(btn&&btn.dataset.on==="1");
  try{ sy.cancel(); }catch(e){}
  clearSay();
  if(wasOn) return;
  var clean=String(txt).replace(/[○◯]+/g,"").replace(/\s+/g," ").trim();
  if(!clean) return;
  var u=new SpeechSynthesisUtterance(clean);
  u.lang=lang; u.rate=0.85; u.pitch=1; u.volume=1;
  var v=pickVoice(lang); if(v) u.voice=v;
  if(btn){
    btn.dataset.on="1";
    u.onend=function(){ btn.dataset.on="0"; };
    u.onerror=function(){ btn.dataset.on="0"; };
  }
  try{ sy.speak(u); }catch(e){ if(btn) btn.dataset.on="0"; }
}

   '<div class="strip">'+CATS.map(function(c,i){
     return '<button data-on="'+(state.cat===i?1:0)+'" data-cat="'+i+'">'+x(c)+'</button>';}).join("")+'</div>'+
   '<div class="card">'+PHRASES[state.cat].map(function(p){
     var main=mineKo?p.ja:p.ko, lg=mineKo?"ja-JP":"ko-KR";
     var say=p.sy?(mineKo?p.sy.ja:p.sy.ko):main;
     return '<div class="ph"><div class="ph-tx">'+
       '<div class="ph-main">'+esc(main)+'</div>'+
       '<div class="ph-read">'+esc(mineKo?p.rk:p.rj)+'</div>'+
       '<div class="ph-sub">'+esc(mineKo?p.ko:p.ja)+'</div></div>'+
       (TTS?'<button class="say" data-on="0" data-say="'+esc(say)+'" data-lg="'+lg+'" aria-label="'+t("sayLbl")+'">'+sayIcon()+'</button>':'')+
       '</div>';}).join("")+'</div>'+
   (TTS?'<p class="note">'+t("phraseNoteTTS")+'</p>':'')+
   '<p class="note">'+t("phraseNote")+'</p>';
}

/* ── 일정 (라이브) ── */
var EVENT_DATES=["2026-08-20","2026-08-21","2026-08-22","2026-08-23"];
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mins(hhmm){var a=hhmm.split(":");return (+a[0])*60+(+a[1]);}
function todayIndex(){return EVENT_DATES.indexOf(ymd(new Date()));}
function liveIndex(dayIdx){
  if(todayIndex()!==dayIdx)return -1;
  var now=new Date(), m=now.getHours()*60+now.getMinutes();
  var rows=DAYS[dayIdx].rows, cur=-1;
  for(var i=0;i<rows.length;i++){ if(mins(rows[i].t)<=m) cur=i; else break; }
  return cur;
}
function clockCard(){
  var now=new Date();
  var hh=String(now.getHours()).padStart(2,"0"), mm=String(now.getMinutes()).padStart(2,"0");
  var ti=todayIndex(), body="";
  if(ti<0){
    var diff=Math.ceil((new Date(2026,7,20)-now)/86400000);
    body='<div class="clock-a"><div class="clock-l">'+(diff>0?"D-"+diff:"—")+'</div>'+
         '<div class="clock-c">'+(diff>0?t("beforeMsg"):t("afterMsg"))+'</div></div>';
  } else {
    var li=liveIndex(ti), rows=DAYS[ti].rows;
    if(li<0){
      body='<div class="clock-a"><div class="clock-l">'+t("soonLbl")+'</div>'+
           '<div class="clock-c">'+esc(x(rows[0].c))+'</div>'+
           '<div class="clock-x">'+rows[0].t+'</div></div>';
    } else {
      var nx=rows[li+1];
      body='<div class="clock-a"><div class="clock-l">'+t("nowLbl")+'</div>'+
           '<div class="clock-c"><span class="pulse"></span>'+esc(x(rows[li].c))+'</div>'+
           (nx?'<div class="clock-x">'+t("nextLbl")+' · '+nx.t+' '+esc(x(nx.c))+'</div>':'')+'</div>';
    }
  }
  return '<div class="clock"><div class="clock-t">'+hh+':'+mm+'</div>'+
    '<div class="clock-d">'+(ti>=0?esc(x(DAYS[ti].label)):"2026. 8. 20 — 8. 23")+'</div>'+body+'</div>';
}
function viewSchedule(){
  var d=DAYS[state.day], li=liveIndex(state.day), ti=todayIndex();
  var h=clockCard();
  h+='<div class="strip">'+DAYS.map(function(dd,i){
     return '<button data-on="'+(state.day===i?1:0)+'" data-day="'+i+'">'+x(dd.label)+
       (i===ti?'<span class="dot"></span>':'')+'</button>';}).join("")+'</div>';
  if(d.mission){
    var tot=0,cnt=0;
    BLOCKS.forEach(function(bb,bi){tot+=bb.missions.length;
      bb.missions.forEach(function(m,mi){if(state.done[bi+"-"+mi])cnt++;});});
    h+='<div class="prog"><div><div class="micro">'+t("missionDone")+'</div>'+
      '<div class="cap-sm" style="margin-top:4px">'+(L==="ko"?"순위는 없어요":"順位はありません")+'</div></div>'+
      '<div style="text-align:right"><div class="prog-n">'+cnt+'<span> / '+tot+'</span></div>'+
      '<div class="bar"><i style="width:'+(tot?cnt/tot*100:0)+'%"></i></div></div></div>';
  }
  h+='<div class="tl">'+d.rows.map(function(r,i){
     var st=li<0?"":(i<li?"past":(i===li?"now":""));
     return '<div class="row"'+(st?' data-st="'+st+'"':'')+'><div class="row-t">'+r.t+'</div>'+
       '<div class="row-c">'+esc(x(r.c))+(r.s?'<small class="row-s">'+x(r.s)+'</small>':'')+
       (r.p?'<span class="row-p"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.5-2.5h7L17 8.5h3a1.5 1.5 0 011.5 1.5v7a1.5 1.5 0 01-1.5 1.5H4A1.5 1.5 0 012.5 17v-7A1.5 1.5 0 014 8.5z"/><circle cx="12" cy="13" r="3.2"/></svg>'+esc(x(r.p))+'</span>':'')+
       (r.m?'<a class="row-m" href="https://map.naver.com/p/search/'+encodeURIComponent(r.m)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.7 7-11a7 7 0 10-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'+t("mapLbl")+'</a>':'')+
       '</div></div>'+(r.blk!=null?missionBlock(r.blk):"");
   }).join("")+'</div>';
  if(d.mission) h+='<p class="note">'+t("missionNote")+'</p>';
  if(d.prep) h+='<div class="prep"><div class="micro">'+t("prepTitle")+'</div><p>'+t("prep")+'</p></div>';
  h+='<div class="sos"><div class="sos-l">'+t("sosTitle")+'</div>'+
    '<p>'+t("sos1")+'</p><p>'+t("sos2")+'</p>'+
    '<a class="call" href="tel:+821020064862">'+x(CONFIG.teacherTel)+'</a>'+
    '<p style="margin-top:10px;text-align:center;font-size:13px">'+t("sosWho")+' '+x(CONFIG.teacherName)+'</p></div>'+
   '<div class="sec" style="padding-bottom:12px"><div class="micro">'+t("pairsTitle")+'</div></div>'+
   '<div class="card">'+PAIRS.map(function(p){
     return '<div class="team"><span class="tn kr">'+nmKr(p.kr)+'</span>'+
       '<span class="badge">'+p.cls+'</span><span class="tn jp">'+nmJp(p.jp)+'</span></div>';
   }).join("")+'</div>';
  return h;
}

function render(){
  var prev=document.getElementById("src");
  var hadFocus=!!(prev&&document.activeElement===prev);
  var caret=hadFocus?prev.selectionStart:null;
  if(TTS){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  if(recObj) stopRec();
  document.body.dataset.lang=L;
  document.documentElement.lang=L;
  renderChrome();
  view.innerHTML = state.tab==="t"?viewTranslate()
                 : state.tab==="p"?viewPhrases()
                 : viewSchedule();
  bindSrc(hadFocus,caret);
}

/* 번역 입력창 — 렌더로 파괴돼도 포커스·커서를 되살린다 */
function autoGrow(ta){
  try{ ta.style.height="auto"; ta.style.height=Math.max(110,ta.scrollHeight)+"px"; }catch(e){}
}
function syncDir(){
  try{
    var sp=view.querySelectorAll(".dirbar span");
    if(sp.length===2){
      sp[0].textContent=state.toJa?"한국어":"日本語";
      sp[1].textContent=state.toJa?"日本語":"한국어";
    }
  }catch(e){}
}
function onSrcInput(ta){
  try{
    var v=ta.value;
    state.src=v;
    autoGrow(ta);
    if(v.trim()){
      if(hasKana(v)&&!hasHangul(v))state.toJa=false;
      else if(hasHangul(v))state.toJa=true;
      syncDir();
    }
    var btn=view.querySelector(".btn");
    if(btn)btn.disabled=!v.trim()||state.busy;
  }catch(e){
    /* 어떤 예외가 나도 타이핑 자체는 막지 않는다 */
    try{ state.src=ta.value; }catch(e2){}
  }
}
function bindSrc(refocus,caret){
  var ta=document.getElementById("src");
  if(!ta)return;
  autoGrow(ta);
  ta.addEventListener("input",function(){onSrcInput(ta);});
  ta.addEventListener("compositionend",function(){onSrcInput(ta);});
  ta.addEventListener("change",function(){onSrcInput(ta);});
  if(refocus){
    try{
      ta.focus({preventScroll:true});
      var pos=(caret==null?ta.value.length:Math.min(caret,ta.value.length));
      ta.setSelectionRange(pos,pos);
    }catch(e){ try{ ta.focus(); }catch(e2){} }
  }
}

async function runTranslate(){
  var text=state.src.trim();
  if(!text||state.busy)return;
  state.busy=true;state.err="";state.out=null;state.copied=false;render();
  try{ state.out=await doTranslate(text,state.toJa); }
  catch(e){ state.err=t("err"); }
  state.busy=false;render();
}

function legacyCopy(txt,cb){
  var ta2=document.createElement("textarea");
  ta2.value=txt;ta2.setAttribute("readonly","");
  ta2.style.position="fixed";ta2.style.top="0";ta2.style.opacity="0";
  document.body.appendChild(ta2);
  try{ ta2.select();ta2.setSelectionRange(0,ta2.value.length);
    if(document.execCommand("copy"))cb(); }catch(e){}
  try{ document.body.removeChild(ta2); }catch(e){}
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-mic],[data-say],[data-tab],[data-act],[data-quick],[data-key],[data-cat],[data-day],[data-blk],[data-lang]");
  if(!el)return;
  if(el.dataset.mic!==undefined){
    var lg=el.dataset.mic;
    state.toJa=(lg==="ko-KR");
    syncDir();
    startRec(lg,el);
    return;
  }
  if(el.dataset.say!==undefined){
    speak(el.dataset.say, el.dataset.lg||"ko-KR", el);
    return;
  }
  if(el.dataset.lang){
    L=el.dataset.lang; state.toJa=(L==="ko"); state.out=null; state.src="";
    saveVal("lang",L); render(); return;
  }
  if(el.dataset.tab){state.tab=el.dataset.tab;render();return;}
  if(el.dataset.cat!==undefined&&el.dataset.cat!==""){state.cat=+el.dataset.cat;render();return;}
  if(el.dataset.day!==undefined&&el.dataset.day!==""){state.day=+el.dataset.day;render();return;}
  if(el.dataset.quick){state.src=el.dataset.quick;state.toJa=(L==="ko");state.out=null;render();return;}
  if(el.dataset.blk!==undefined&&el.dataset.blk!==""){
    var bi=+el.dataset.blk;
    state.open[bi]=!state.open[bi];
    render();return;
  }
  if(el.dataset.key){
    var k=el.dataset.key;
    state.done[k]=!state.done[k];
    saveVal("missions-0822",JSON.stringify(state.done));
    render();return;
  }
  var a=el.dataset.act;
  if(a==="swap"){state.toJa=!state.toJa;state.out=null;render();return;}
  if(a==="go"){runTranslate();return;}
  if(a==="copy"&&state.out){
    var txt=state.out.target, done=function(){
      state.copied=true;render();
      setTimeout(function(){state.copied=false;render();},1600);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){legacyCopy(txt,done);});
    }else legacyCopy(txt,done);
  }
});

(async function init(){
  var lg=await loadVal("lang");
  if(lg==="ja"||lg==="ko"){L=lg;state.toJa=(L==="ko");}
  else if((navigator.language||"").indexOf("ja")===0){L="ja";state.toJa=false;}
  var saved=await loadVal("missions-0822");
  if(saved){try{state.done=JSON.parse(saved);}catch(e){}}
  var ti=todayIndex();
  if(ti>=0){state.day=ti;state.tab="s";}
  render();
  setInterval(function(){ if(state.tab==="s") render(); },60000);
})();
</script>
